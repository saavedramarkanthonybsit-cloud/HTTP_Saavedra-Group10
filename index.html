<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 5%;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .layout {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right {
            position: sticky;
            top: 20px;
        }

        .card,
        .result {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .card h2,
        .result h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .method {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post {
            background: #d1fae5;
            color: #166534;
        }

        .get {
            background: #dbeafe;
            color: #1e40af;
        }

        .put {
            background: #fef3c7;
            color: #92400e;
        }

        .patch {
            background: #ede9fe;
            color: #6b21a8;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: span 2;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #777;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-post {
            background: #22c55e;
        }

        .btn-get {
            background: #3b82f6;
        }

        .btn-put {
            background: #f59e0b;
        }

        .btn-patch {
            background: #8b5cf6;
        }

        .btn-delete {
            background: #ef4444;
        }

        .result {
            min-height: 200px;
        }

        #result {
            font-size: 14px;
            line-height: 1.4;
        }

        #result h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        #result p {
            margin: 10px 0;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .right {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Game Management System</h1>
</header>

<div class="layout">

    <div class="left">

        <!-- POST -->
        <div class="card">

            <span class="method post">POST</span>

            <h2>Add Game</h2>

            <div class="form">

                <div class="input-box">
                    <label>Game ID</label>
                    <input type="text" id="postId" placeholder="G001">
                </div>

                <div class="input-box">
                    <label>Game Title</label>
                    <input type="text" id="postTitle" placeholder="">
                </div>

                <div class="input-box">
                    <label>Genre</label>
                    <input type="text" id="postGenre" placeholder="">
                </div>

                <div class="input-box">
                    <label>Platform</label>
                    <input type="text" id="postPlatform" placeholder="PC/Console/Mobile">
                </div>

                <div class="input-box full">
                    <label>Price</label>
                    <input type="number" id="postPrice" placeholder="">
                </div>

            </div>

            <button class="btn-post" onclick="addGame()">Add Game</button>

        </div>


        <!-- GET -->
        <div class="card">

            <span class="method get">GET</span>

            <h2>Search Game</h2>

            <div class="input-box">
                <label>Game ID</label>
                <input type="text" id="getId" placeholder="G001">
            </div>

            <button class="btn-get" onclick="getGame()">Search</button>

        </div>


        <!-- PUT -->
        <div class="card">

            <span class="method put">PUT</span>

            <h2>Replace Game</h2>

            <div class="form">

                <div class="input-box">
                    <label>Game ID</label>
                    <input type="text" id="putId" placeholder="G001">
                </div>

                <div class="input-box">
                    <label>Game Title</label>
                    <input type="text" id="putTitle" placeholder="">
                </div>

                <div class="input-box">
                    <label>Genre</label>
                    <input type="text" id="putGenre" placeholder="">
                </div>

                <div class="input-box">
                    <label>Platform</label>
                    <input type="text" id="putPlatform" placeholder="">
                </div>

                <div class="input-box full">
                    <label>Price</label>
                    <input type="number" id="putPrice" placeholder="">
                </div>

            </div>

            <button class="btn-put" onclick="replaceGame()">Replace</button>

        </div>


        <!-- PATCH -->
        <div class="card">

            <span class="method patch">PATCH</span>

            <h2>Update Game</h2>

            <div class="form">

                <div class="input-box">
                    <label>Game ID</label>
                    <input type="text" id="patchId" placeholder="">
                </div>

                <div class="input-box">
                    <label>Field</label>

                    <select id="patchField">
                        <option value="title">Title</option>
                        <option value="genre">Genre</option>
                        <option value="platform">Platform</option>
                        <option value="price">Price</option>
                    </select>
                </div>

                <div class="input-box full">
                    <label>New Value</label>
                    <input type="text" id="patchValue" placeholder="Kung san ka masaya pero pili ka muna kung title ba or what  ">
                </div>

            </div>

            <button class="btn-patch" onclick="patchGame()">Update</button>

        </div>


        <!-- DELETE -->
        <div class="card">

            <span class="method delete">DELETE</span>

            <h2>Delete Game</h2>

            <div class="input-box">
                <label>Game ID</label>
                <input type="text" id="deleteId" placeholder="pls wag po ate">
            </div>

            <button class="btn-delete" onclick="deleteGame()">Delete</button>

        </div>

    </div>


    <!-- RESULT -->
    <div class="right">

        <div class="result">

            <h2>Result</h2>

            <div id="result">
                No request yet.
            </div>

        </div>

    </div>

</div>

<footer>
    Game Management System
</footer>

<script src="script.js"></script>

</body>
</html>
